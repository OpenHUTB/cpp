site_name: 引擎优化文档
# 参考链接：https://blog.csdn.net/m0_63203517/article/details/129765689

#repo_url: https://github.com/carla-simulator/carla
#docs_dir: Docs
#edit_uri: 'edit/master/Docs/'


# 设置编译页面的链接的前缀
repo_url: https://github.com/OpenHUTB/cpp

# 页面右上角添加直接编辑页面的按钮
edit_uri: edit/master/docs/

theme:
  name: readthedocs
  sticky_navigation: True
  navigation_depth: 3
  features:
    - search.suggest # 在目录栏中的搜索框中输入一些字母时推荐补全整个单词
extra_css: [extra.css]



# mathjax用于单独公式展示
extra_javascript:
  # - extra.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://cdn.rawgit.com/knsv/mermaid/6.0.0/dist/mermaid.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/raphael/2.2.7/raphael.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/js-sequence-diagrams/1.0.6/sequence-diagram-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/flowchart/1.6.5/flowchart.min.js
  - js/umlconvert.js

plugins:
#  - mkdocs-video
  - search:
      lang: ja
      separator: '[\s\-\.]+'
      min_search_length: 3

extra:
  generator: false

copyright: OpenHUTB 版权所有 &copy; 2025

nav:
- 首页: 'index.md'
- 引擎 C++ 开发教程: './tutorial/add_actor_subclass.md'
- 引擎源码解析: './engine/game_mode.md'
- 引擎优化入门: './optimization/Default-topic.md'
- 引擎概述: './optimization/EngineOverview/Engine-Overview.md'
- 渲染: './optimization/Rendering/Rendering.md'
- 物理: './optimization/Physics/Physics.md'
- 性能和优化: './optimization/Performance/Performance.md'
- 平台: './optimization/Platforms/Platforms.md'
- 插件: './optimization/Plugins/Plugins.md'
- 工具和自动化: './optimization/Tools/Tools.md'
- 项目和演示: './optimization/ProjectsAndDemos.md'
- 贡献: './optimization/Contributing/Contributing.md'
- 参考: './optimization/Reference/Reference.md'


# - mdx_math 用于行内公式显示
markdown_extensions:
  - admonition
  - mdx_math
  - pymdownx.superfences:
      custom_fences: [
         { name: flow, class: uml-flowchart }
        ,{ name: sequence, class: uml-sequence-diagram }
        ,{ name: mermaid, class: mermaid }
      ]
